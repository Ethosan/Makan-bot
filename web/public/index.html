<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#DCE0D5">
<title>The List</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Contrast checked against the sage ground: muted 5.18:1, brass 4.50:1,
   spark 5.81:1, both person colours above 6:1. All clear AA. */
:root{
  --paper:#DCE0D5; --card:#F1F3EB; --sink:#D0D5C8;
  --ink:#191E19; --muted:#545C51; --rule:#B4BBA9;
  --brass:#7A5F1C; --spark:#92321C;
  --p1:#245645; --p2:#5F3669;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --serif:"Instrument Serif",Georgia,serif;
  --pad:clamp(18px,5.5vw,28px);
  --tap:46px;
  /* Overridden inside Telegram, where env() reads as zero. */
  --app-h:100dvh;
  --app-w:100%;
  --tg-top:env(safe-area-inset-top);
  --tg-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;width:100%;max-width:100%;margin:0;overflow:hidden;overflow-x:clip}
body{background:var(--paper);color:var(--ink);
  font-family:"Karla",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--brass);outline-offset:2px;border-radius:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============ shell: page never scrolls, only the list ============ */
.screen{height:var(--app-h);width:var(--app-w);max-width:100%;margin:0 auto;overflow-x:clip;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.scroll{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:0 var(--pad)}
/* A few px of slack so nothing can ever touch the edge, even if a font
   measures slightly wider than expected. */
#board{padding-right:calc(var(--pad) + 6px)}
.bar{padding:12px var(--pad) calc(14px + var(--tg-bottom));
  border-top:1px solid var(--rule);background:var(--paper);display:flex;gap:9px}

/* ============ gate ============ */
.gate{height:var(--app-h);width:var(--app-w);max-width:100%;margin:0 auto;display:grid;grid-template-rows:1fr auto;
  padding:calc(var(--pad) + var(--tg-top)) var(--pad) calc(var(--pad) + var(--tg-bottom))}
.gate-mid{display:flex;flex-direction:column;justify-content:center;min-height:0}
.mark{font-family:var(--serif);font-weight:400;font-size:clamp(56px,19vw,96px);
  line-height:.86;letter-spacing:-.025em;margin:0}
.mark em{font-style:italic;color:var(--brass)}
.tagline{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:14px 0 0}
.pwfield{margin-top:38px;position:relative}
.pwfield label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.pwfield input{width:100%;padding:15px 52px 15px 2px;font-size:19px;font-family:var(--mono);
  background:none;border:0;border-bottom:1.5px solid var(--rule);color:var(--ink);
  letter-spacing:.16em;border-radius:0}
.pwfield input:focus{outline:none;border-bottom-color:var(--ink)}
.peek{position:absolute;right:0;bottom:6px;width:var(--tap);height:var(--tap);
  background:none;border:0;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.pick{display:flex;flex-direction:column;gap:9px;margin-top:30px}
.pick button{min-height:62px;padding:0 18px;border:1.5px solid var(--rule);background:var(--card);
  border-radius:4px;font-family:var(--serif);font-size:25px;text-align:left;
  display:flex;align-items:center;gap:13px}
.pick button:hover{border-color:var(--ink)}
.note{font-family:var(--mono);font-size:12px;color:var(--spark);margin-top:16px;min-height:18px}

/* ============ masthead ============ */
.mast{padding:calc(12px + var(--tg-top)) var(--pad) 0;overflow:hidden}
.mast-row{border-bottom:2px solid var(--ink);padding-bottom:8px;overflow:hidden}
.mast-row h1{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1;margin:0;
  white-space:nowrap}
/* Own line, wrapping. A title-and-names row is the one pair guaranteed to be
   too wide on a narrow phone. */
.key{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.who.me{color:var(--ink);font-weight:500}
.swatch{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:middle;
  margin-right:5px;flex:none}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 0}
.modes button{min-height:38px;padding:0 10px;font-family:var(--mono);font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--rule);background:none;
  color:var(--muted);border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
/* Wraps to a second line on narrow phones rather than scrolling sideways. */
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:9px 0 11px}
.filters button{min-height:34px;padding:0 11px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--rule);background:none;
  color:var(--muted);border-radius:999px;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.filters[hidden]{display:none}

/* ============ list row ============ */
/* Two columns only. Everything textual lives in one shrinkable box, and the
   score is an explicit flex:none so it can never be the thing that gets cut. */
.row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 12px;align-items:center;
  width:100%;padding:13px 0;border:0;border-bottom:1px solid var(--rule);background:none;
  text-align:left;min-height:82px}
.row:last-child{border-bottom:0}
.r-body{min-width:0}
.r-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.r-rank{flex:none;font-family:var(--serif);font-size:19px;line-height:1;color:var(--brass)}
.r-rank.plain{color:var(--rule)}
.r-name{flex:1 1 auto;min-width:0;font-family:var(--serif);font-size:20px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-score{flex:none;margin-left:auto;padding-left:4px;font-family:var(--mono);font-size:16px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.r-thumb{width:56px;height:56px;border-radius:3px;background:var(--sink);object-fit:cover;
  display:block}
.r-thumb.none{display:grid;place-items:center;font-family:var(--serif);font-size:21px;
  color:var(--rule)}
.r-meta{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-track{position:relative;height:9px;margin-top:7px;margin-right:3px}
.r-axis{position:absolute;top:4px;left:0;right:0;height:1px;background:var(--rule)}
.r-span{position:absolute;top:3.5px;height:2px;background:var(--ink);opacity:.3;border-radius:2px}
.r-span.wide{background:var(--spark);opacity:.75}
.r-dot{position:absolute;top:1px;width:7px;height:7px;border-radius:50%;margin-left:-3.5px}
.pend-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:3px 8px}
.w-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;
  width:100%;max-width:100%;overflow:hidden;
  min-height:62px;padding:13px 0;border:0;border-bottom:1px solid var(--rule);background:none;
  text-align:left}
.w-row:last-child{border-bottom:0}
.w-name{display:block;font-family:var(--serif);font-size:21px;line-height:1.15;
  overflow-wrap:anywhere}
.w-note{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-top:3px}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--rule);border-radius:999px;padding:4px 9px;color:var(--muted);white-space:nowrap}
.chip.set{border-color:var(--ink);color:var(--ink)}
.dice{font-family:var(--serif);font-size:44px;line-height:1;margin:0 0 4px}
.section{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:26px 0 2px;padding-top:12px;border-top:1px solid var(--rule)}
.empty{font-family:var(--serif);font-size:22px;color:var(--muted);text-align:center;padding:60px 10px}

/* ============ buttons ============ */
.btn{flex:1;min-width:0;min-height:var(--tap);padding:0 12px;border:0;border-radius:4px;background:var(--ink);
  color:var(--card);font-family:var(--mono);font-size:12px;letter-spacing:.11em;text-transform:uppercase}
.btn[disabled]{opacity:.4}
.btn.ghost{background:none;border:1.5px solid var(--rule);color:var(--muted)}
.btn.danger{background:none;border:1.5px solid var(--spark);color:var(--spark)}
.btn.slim{flex:0 0 auto}

/* ============ panel ============ */
.panel{position:fixed;left:50%;transform:translateX(-50%);top:0;width:var(--app-w);
  max-width:100%;height:var(--app-h);z-index:40;overflow-x:clip;
  background:var(--paper);display:none}
.panel.open{display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.p-head{padding:calc(12px + var(--tg-top)) var(--pad) 12px;
  border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px}
.p-head h2{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.1;margin:0;
  flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{width:var(--tap);height:var(--tap);flex:none;border:0;background:none;font-size:22px;
  display:grid;place-items:center;border-radius:4px}
.icon:hover{background:var(--sink)}
.dots{display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--ink)}

.hero{width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--sink);border-radius:4px}
.d-name{font-family:var(--serif);font-size:32px;line-height:1.05;margin:18px 0 6px;
  overflow-wrap:anywhere}
.d-meta{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted)}
.d-total{font-family:var(--serif);font-size:60px;line-height:1;margin:20px 0 0}
.d-sub{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted)}
.grid{width:100%;table-layout:fixed;border-collapse:collapse;margin-top:22px;
  font-family:var(--mono);font-size:12px}
.grid th,.grid td{padding:9px 4px;text-align:right;border-bottom:1px solid var(--rule)}
.grid th:first-child,.grid td:first-child{text-align:left;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);font-weight:400}
.grid thead th{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:500}
.grid td{font-variant-numeric:tabular-nums}
.grid tfoot td{font-weight:500;border-bottom:0;padding-top:12px}

/* ============ form steps ============ */
.step{padding:var(--pad) 0}
.q{font-family:var(--serif);font-size:29px;line-height:1.12;margin:0 0 6px;overflow-wrap:anywhere}
.q-hint{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 22px}
.field{margin-bottom:20px}
.field>label,.legend{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input[type=text],input[type=date],textarea{width:100%;min-height:var(--tap);padding:12px 13px;
  border:1.5px solid var(--rule);background:var(--card);color:var(--ink);border-radius:4px;
  font:inherit;font-size:17px}
textarea{font-family:var(--mono);font-size:15px;line-height:1.6;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--ink)}
.q-hint code{font-family:var(--mono);font-size:10.5px;background:var(--card);padding:1px 4px;
  border-radius:2px}
fieldset{border:0;padding:0;margin:0}
.seg{display:flex;gap:7px}
.seg button{flex:1;min-height:58px;border:1.5px solid var(--rule);background:var(--card);
  color:var(--muted);border-radius:4px;font-family:var(--mono);font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;display:grid;place-items:center;gap:3px;padding:6px 2px}
.seg button b{font-family:var(--serif);font-size:19px;font-weight:400;letter-spacing:0;
  text-transform:none}
.seg button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{aspect-ratio:1;min-height:52px;border:1.5px solid var(--rule);background:var(--card);
  border-radius:4px;font-family:var(--mono);font-size:17px;color:var(--ink);padding:0}
.scale button[aria-checked="true"]{color:var(--card);border-color:transparent}
.drop{width:100%;aspect-ratio:16/10;border:1.5px dashed var(--rule);border-radius:4px;
  background:var(--card);display:grid;place-items:center;gap:6px;overflow:hidden;padding:0;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.drop img{width:100%;height:100%;object-fit:cover;display:none}
.drop.has img{display:block}
.drop.has span{display:none}
.status{font-family:var(--mono);font-size:12px;margin-top:14px;min-height:18px;color:var(--spark)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ============ gate ============ -->
<div class="gate" id="gate">
  <div class="gate-mid">
    <h1 class="mark">The<br>L<em>i</em>st</h1>
    <p class="tagline" id="tagline">Everywhere we've eaten</p>

    <div id="gate-pw">
      <div class="pwfield">
        <label for="pw">Password</label>
        <input type="password" id="pw" autocomplete="current-password"
               enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="peek" id="peek" type="button" aria-pressed="false"
                aria-label="Show password">Show</button>
      </div>
    </div>

    <div class="pick" id="gate-who" hidden role="group" aria-label="Who are you?"></div>
    <p class="note" id="gate-note" role="status" aria-live="polite"></p>
  </div>
  <div class="bar" id="gate-bar" style="border-top:0;padding-left:0;padding-right:0">
    <button class="btn" id="pw-go">Open the list</button>
  </div>
</div>

<!-- ============ app ============ -->
<div class="screen" id="app" hidden>
  <header class="mast">
    <div class="mast-row">
      <h1>The List</h1>
    </div>
    <div class="key" id="key"></div>
    <nav class="modes" id="modes" aria-label="Which list"></nav>
    <nav class="filters" id="filters" aria-label="Filter by kind of place"></nav>
  </header>
  <main class="scroll" id="board" tabindex="-1"></main>
  <div class="bar">
    <button class="btn" id="add">+ Add a place</button>
  </div>
</div>

<!-- ============ panel ============ -->
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="p-title">
  <header class="p-head">
    <button class="icon" id="p-back" aria-label="Back">&larr;</button>
    <h2 id="p-title"></h2>
    <div class="dots" id="p-dots" aria-hidden="true"></div>
  </header>
  <div class="scroll" id="p-body"></div>
  <div class="bar" id="p-bar"></div>
</div>

<script>
"use strict";

const TIERS = ["cheap","normal","fancy"];
const TIER_LABEL = {cheap:"Cheap eats", normal:"Normal", fancy:"Fancy"};
const TIER_NOTE  = {cheap:"under ~$15", normal:"a sit-down meal", fancy:"an occasion"};
const CATS = ["food","ambiance","aesthetics","service"];
const HINT = {
  food:"The cooking alone. Ignore everything else.",
  ambiance:"How the room felt \u2014 noise, lighting, comfort.",
  aesthetics:"How it looked \u2014 plating, interior, your photos.",
  service:"The staff. Attentive, warm, competent, or not."
};

let PW = localStorage.getItem("makan.pw") || "";
let ME = Number(localStorage.getItem("makan.me")) || null;
let DATA = null, mode = "rated", filter = "all", lastFocus = null;

// Opened inside Telegram? Then Telegram signs who you are and we skip the
// password and the picker entirely.
const TG = window.Telegram?.WebApp?.initData ? window.Telegram.WebApp : null;
if (TG) {
  TG.ready();
  TG.expand();
  // Match Telegram's own chrome to the page, so there's no dark bar above the sage.
  try { TG.setHeaderColor("#DCE0D5"); TG.setBackgroundColor("#DCE0D5"); } catch {}
  // Otherwise dragging the list down closes the whole app.
  try { TG.disableVerticalSwipes?.(); } catch {}

  const applyInsets = () => {
    const root = document.documentElement;
    // safeAreaInset is the device notch; contentSafeAreaInset is Telegram's own
    // header. Neither reaches CSS env(), so they have to be set by hand.
    const dev = TG.safeAreaInset || {top:0, bottom:0};
    const chrome = TG.contentSafeAreaInset || {top:0, bottom:0};
    root.style.setProperty("--tg-top", ((dev.top||0) + (chrome.top||0)) + "px");
    root.style.setProperty("--tg-bottom", ((dev.bottom||0) + (chrome.bottom||0)) + "px");
    // viewportStableHeight is the visible height; 100dvh overshoots in here.
    const h = TG.viewportStableHeight || TG.viewportHeight || window.innerHeight;
    root.style.setProperty("--app-h", h + "px");
  };
  applyInsets();
  ["viewportChanged","safeAreaChanged","contentSafeAreaChanged"].forEach(ev => {
    try { TG.onEvent(ev, () => { applyInsets(); pinWidth(); }); } catch {}
  });
  document.documentElement.classList.add("in-tg");
}

/**
 * Telegram's webview can report a layout viewport wider than what's actually
 * visible, which pushes the right edge of everything off screen. Pin the app to
 * the narrowest width any API reports.
 */
function pinWidth() {
  const cands = [
    document.documentElement.clientWidth,
    window.innerWidth,
    window.visualViewport?.width,
  ].filter(n => typeof n === "number" && n > 0);
  if (!cands.length) return;
  const w = Math.floor(Math.min(...cands));
  document.documentElement.style.setProperty("--app-w", w + "px");
}

pinWidth();
window.addEventListener("resize", pinWidth);
window.visualViewport?.addEventListener("resize", pinWidth);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const colour = i => i % 2 === 0 ? "var(--p1)" : "var(--p2)";
const idx = id => Math.max(0, (DATA?.people ?? []).findIndex(p => p.id === id));
const pos = s => ((s - 1) / 9) * 100;
const shortDate = d => d ? new Date(d + "T00:00:00")
  .toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"2-digit"}) : "no date";

/**
 * Phone photos are 3-8MB at 4000px. Base64 adds a third on top, and Netlify
 * rejects request bodies over 6MB before the function ever runs. Downscaling
 * here keeps uploads around 200-400KB and makes the page load faster too.
 */
const MAX_EDGE = 1600;
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file isn't an image")); };
    img.src = url;
  });
}

async function api(action, payload = {}) {
  const res = await fetch("/api", {
    method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({action, password: PW, initData: TG?.initData, ...payload})
  });
  let out;
  try {
    out = await res.json();
  } catch {
    // Non-JSON means the request never reached the function.
    throw new Error(res.status === 413
      ? "That photo is too large to upload."
      : "The server didn't respond (" + res.status + "). Try again.");
  }
  if (!res.ok) throw new Error(out.error || "Something went wrong");
  return out;
}

/* ================= gate ================= */

$("peek").onclick = () => {
  const on = $("pw").type === "password";
  $("pw").type = on ? "text" : "password";
  $("peek").textContent = on ? "Hide" : "Show";
  $("peek").setAttribute("aria-pressed", String(on));

/* ================= list ================= */

function miniTrack(e) {
  const sorted = [...e.scores].sort((a,b) => a.total - b.total);
  const lo = sorted[0].total, hi = sorted[sorted.length-1].total;
  return '<div class="r-track" aria-hidden="true"><div class="r-axis"></div>'
    + '<div class="r-span'+(e.gap>=1.5?" wide":"")+'" style="left:'+pos(lo)
    + '%;width:'+(pos(hi)-pos(lo))+'%"></div>'
    + e.scores.map(s => '<i class="r-dot" style="left:'+pos(s.total)+'%;background:'
        + colour(idx(s.personId))+'"></i>').join("") + '</div>';
}

function thumb(e) {
  return e.photo_url
    ? '<img class="r-thumb" src="'+esc(e.photo_url)+'" alt="" loading="lazy">'
    : '<div class="r-thumb none" aria-hidden="true">'+esc(e.name.trim()[0] || "?")+'</div>';
}

function rowHtml(e, rank) {
  const meta = [TIER_LABEL[e.tier], shortDate(e.visited_on)];
  if (e.gap >= 1.5) meta.push("split " + e.gap.toFixed(1));
  const label = e.name + ", " + e.combined.toFixed(2) + " out of 10, " + TIER_LABEL[e.tier];
  return '<button class="row" data-open="'+e.id+'" aria-label="'+esc(label)+'">'
    + thumb(e)
    + '<span class="r-body">'
    +   '<span class="r-top">'
    +     '<span class="r-rank'+(rank>3?" plain":"")+'" aria-hidden="true">'+rank+'</span>'
    +     '<span class="r-name">'+esc(e.name)+'</span>'
    +     '<span class="r-score">'+e.combined.toFixed(2)+'</span>'
    +   '</span>'
    +   '<span class="r-meta">'+meta.join(" &middot; ")+'</span>'
    +   miniTrack(e)
    + '</span></button>';
}

function pendHtml(e) {
  return '<button class="row" data-open="'+e.id+'" aria-label="'+esc(e.name+", not fully rated")+'">'
    + thumb(e)
    + '<span class="r-body"><span class="r-top">'
    +   '<span class="r-name">'+esc(e.name)+'</span>'
    +   '<span class="r-score"><span class="pend-tag">Rate</span></span>'
    + '</span>'
    + '<span class="r-meta">'+esc(e.progress)+'</span></span></button>';
}

    b.onclick = () => openDetail(Number(b.dataset.open)));

/**
 * Revisit roll. Weighted by score, because uniform random keeps offering the
 * one you both rated 6.5 — not what "where should we go" means. Squaring the
 * distance above 4 makes an 8.9 about three times likelier than a 6.9.
 */
function rollAgain() {
  const pool = DATA.entries.filter(e => filter === "all" || e.tier === filter);
  if (!pool.length) { alert("Nothing fully rated in that tier yet."); return; }

  const weights = pool.map(e => Math.pow(Math.max(0.1, e.combined - 4), 2));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total, e = pool[pool.length - 1];
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) { e = pool[i]; break; } }

  panelClose();
  panelOpen("Go back to",
    '<div class="step" style="text-align:center">'
    + (e.photo_url ? '<img class="hero" src="'+esc(e.photo_url)+'" alt="">' : '')
    + '<h3 class="q" style="font-size:36px;margin-top:20px">'+esc(e.name)+'</h3>'
    + '<p class="q-hint">'+TIER_LABEL[e.tier]+' \u00b7 you gave it '+e.combined.toFixed(2)+'</p>'
    + '<p class="d-sub" style="margin-top:26px">weighted towards what you rated highly</p></div>',
    '<button class="btn ghost" id="a-again">\u{1F3B2} Again</button>'
    + '<button class="btn" id="a-open">See the scores</button>');
  $("p-back").dataset.act = "close";
  $("a-again").onclick = rollAgain;
  $("a-open").onclick = () => openDetail(e.id);
}

/** Rolls from the want list \u2014 somewhere new. Uniform, since none are rated. */
function rollOne(tier = null) {
  const pool = (DATA.wishlist ?? []).filter(w => !tier || w.tier === tier);
  if (!pool.length) { alert("Nothing to pick from in that tier."); return; }
  const w = pool[Math.floor(Math.random() * pool.length)];
  panelClose();
  panelOpen("Tonight",
    '<div class="step" style="text-align:center;padding-top:14vh">'
    + '<p class="dice" aria-hidden="true">\u{1F3B2}</p>'
    + '<h3 class="q" style="font-size:38px">'+esc(w.name)+'</h3>'
    + '<p class="q-hint">'+(w.tier ? TIER_LABEL[w.tier] : "tier not tagged yet")
    + (w.note ? " \u00b7 " + esc(w.note) : "")+'</p></div>',
    '<button class="btn ghost" id="r-again">\u{1F3B2} Again</button>'
    + '<button class="btn" id="r-went">We went</button>');
  $("p-back").dataset.act = "close";
  $("r-again").onclick = () => rollOne(tier);
  $("r-went").onclick = async () => {
    $("r-went").disabled = true;
    try {

}

/* ================= panel plumbing ================= */

function panelOpen(title, bodyHtml, barHtml, opts = {}) {
  lastFocus = lastFocus || document.activeElement;
  $("p-title").textContent = title;
  $("p-body").innerHTML = bodyHtml;
  $("p-bar").innerHTML = barHtml;
  $("p-dots").innerHTML = opts.steps
    ? Array.from({length:opts.steps}, (_,i) => '<i class="'+(i<=opts.step?"on":"")+'"></i>').join("")
    : "";
  $("panel").classList.add("open");
  $("p-body").scrollTop = 0;
  ($("p-body").querySelector("input,button") || $("p-back")).focus();
}

function panelClose() {
  $("panel").classList.remove("open");
  if (lastFocus) { lastFocus.focus(); lastFocus = null; }
}

$("p-back").onclick = () => ($("p-back").dataset.act === "step" ? backStep() : panelClose());

document.addEventListener("keydown", e => {
  if (!$("panel").classList.contains("open")) return;
  if (e.key === "Escape") { e.preventDefault(); $("p-back").click(); return; }
  if (e.key !== "Tab") return;
  const f = [...$("panel").querySelectorAll('button,input,[tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length-1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

/* ================= detail ================= */

function find(id) {
  return DATA.entries.find(e => e.id === id) || DATA.pending.find(e => e.id === id) || null;
}

function openDetail(id) {
  const e = find(id);
  if (!e) return;
  const rated = Boolean(e.scores);
  const meta = [TIER_LABEL[e.tier], shortDate(e.visited_on)];

  let body = '<div class="step">'
    + (e.photo_url ? '<img class="hero" src="'+esc(e.photo_url)+'" alt="'+esc(e.name)+'">' : "")
    + '<h3 class="d-name">'+esc(e.name)+'</h3>'
    + '<p class="d-meta">'+meta.join(" &middot; ")+'</p>';

  if (rated) {
    body += '<p class="d-total">'+e.combined.toFixed(2)+'</p>'
      + '<p class="d-sub">Combined &middot; weighted for '+TIER_LABEL[e.tier].toLowerCase()+'</p>'
      + '<table class="grid"><caption class="sr">Scores by category</caption><thead><tr><th scope="col">Category</th>'
      + e.scores.map(s => '<th scope="col" style="color:'+colour(idx(s.personId))+'">'
          + esc(DATA.people[idx(s.personId)]?.name ?? "?")+'</th>').join("")
      + '</tr></thead><tbody>'
      + CATS.map(c => '<tr><th scope="row">'+c+'</th>'
          + e.scores.map(s => '<td>'+s[c]+'</td>').join("")+'</tr>').join("")
      + '</tbody><tfoot><tr><td>Weighted</td>'
      + e.scores.map(s => '<td>'+s.total.toFixed(2)+'</td>').join("")+'</tr></tfoot></table>'
      + (e.gap >= 1.5
          ? '<p class="d-sub" style="color:var(--spark);margin-top:14px">You were '
            + e.gap.toFixed(2)+' apart on this one.</p>' : "");
  } else {
    body += '<p class="d-total" style="color:var(--muted)">&mdash;</p>'
      + '<p class="d-sub">'+esc(e.progress)+'</p>';
  }
  body += '</div>';

  const mine = (e.ratings || []).find(r => r.personId === ME);
  const done = mine && CATS.every(c => mine[c] !== null);

  panelClose();
  panelOpen(e.name, body,
    '<button class="btn ghost slim" id="d-del">Delete</button>'
    + '<button class="btn" id="d-edit">'+(done ? "Edit" : "Rate it")+'</button>');
  $("p-back").dataset.act = "close";

  $("d-edit").onclick = () => openForm(e.id, done ? 0 : 2);
  $("d-del").onclick = async () => {
    if (!confirm("Delete " + e.name + ", and both your ratings of it?")) return;
    await api("delete", {id: e.id});
    DATA = await api("list");
    panelClose();
    render();
  };
}

/* ================= form: one question per screen ================= */

let draft = null, step = 0;
const STEPS = 3;

function openForm(id, startStep = 0) {
  const e = id === null ? null : find(id);
  const mine = e ? ((e.ratings || []).find(r => r.personId === ME) || {}) : {};
  draft = {
    id: e?.id ?? null,
    name: e?.name ?? "",
    tier: e?.tier ?? "normal",
    visited_on: e?.visited_on ?? "",
    photo_url: e?.photo_url ?? null,
    dataUrl: null,
    cat: 0,
    scores: Object.fromEntries(CATS.map(c => [c, mine[c] ?? null]))
  };
  step = startStep;
  panelClose();
  drawStep();
}

function backStep() {
  if (step === 2 && draft.cat > 0) { draft.cat--; drawStep(); return; }
  if (step > 0) { step--; drawStep(); return; }
  panelClose();
}

function drawStep() {
  const title = draft.id ? draft.name || "Edit" : "Add a place";
  if (step === 0) drawDetails(title);
  else if (step === 1) drawPhoto(title);
  else drawRating(title);
  $("p-back").dataset.act = "step";
  $("p-back").setAttribute("aria-label", step === 0 ? "Cancel" : "Back");
}

function drawDetails(title) {
  panelOpen(title,
    '<div class="step">'
    + '<h3 class="q">Where did you go?</h3>'
    + '<p class="q-hint">The kind of place decides how the four scores get weighted.</p>'
    + '<div class="field"><label for="f-name">Name</label>'
    + '<input type="text" id="f-name" value="'+esc(draft.name)+'" enterkeyhint="next"'
    + ' autocapitalize="words" placeholder="e.g. Burnt Ends"></div>'
    + '<fieldset class="field"><legend class="legend">Kind of place</legend>'
    + '<div class="seg" role="radiogroup" aria-label="Kind of place" id="f-tier">'
    + TIERS.map(t => '<button role="radio" data-t="'+t+'" aria-checked="'+(t===draft.tier)+'">'
        + '<b>'+TIER_LABEL[t]+'</b>'+TIER_NOTE[t]+'</button>').join("")
    + '</div></fieldset>'
    + '<div class="field"><label for="f-date">When (optional)</label>'
    + '<input type="date" id="f-date" value="'+esc(draft.visited_on)+'"></div>'
    + '<p class="status" id="f-note" role="status" aria-live="polite"></p></div>',
    '<button class="btn" id="f-next">Next</button>',
    {steps: STEPS, step: 0});

  $("f-tier").querySelectorAll("button").forEach(b => b.onclick = () => {
    draft.tier = b.dataset.t;
    $("f-tier").querySelectorAll("button").forEach(x =>
      x.setAttribute("aria-checked", String(x === b)));
  });

  $("f-next").onclick = () => {
    const name = $("f-name").value.trim();
    if (!name) { $("f-note").textContent = "Give it a name first."; $("f-name").focus(); return; }
    draft.name = name;
    draft.visited_on = $("f-date").value || "";
    step = 1;
    drawStep();
  };
}

function drawPhoto(title) {
  panelOpen(title,
    '<div class="step">'
    + '<h3 class="q">Got a photo?</h3>'
    + '<p class="q-hint">Only one of you needs to add it. Skip if you\u2019d rather not.</p>'
    + '<button class="drop'+(draft.photo_url||draft.dataUrl?" has":"")+'" id="f-drop">'
    + '<img id="f-thumb" src="'+esc(draft.dataUrl||draft.photo_url||"")+'" alt="">'
    + '<span>Choose a photo</span></button>'
    + '<input type="file" id="f-file" accept="image/*" class="sr">'
    + '<p class="status" id="f-note" role="status" aria-live="polite"></p></div>',
    '<button class="btn ghost" id="f-skip">Skip</button>'
    + '<button class="btn" id="f-next">Next</button>',
    {steps: STEPS, step: 1});

  $("f-drop").onclick = () => $("f-file").click();
  $("f-file").onchange = async () => {
    const file = $("f-file").files[0];
    if (!file) return;
    const note = $("f-note");
    note.style.color = "var(--muted)";
    note.textContent = "Preparing\u2026";
    try {
      draft.dataUrl = await shrink(file);
      $("f-thumb").src = draft.dataUrl;
      $("f-drop").classList.add("has");
      note.textContent = "";
    } catch (err) {
      note.style.color = "var(--spark)";
      note.textContent = err.message;
    }
  };
  $("f-skip").onclick = () => { step = 2; drawStep(); };
  $("f-next").onclick = () => { step = 2; drawStep(); };
}

function drawRating(title) {
  const c = CATS[draft.cat];
  const last = draft.cat === CATS.length - 1;
  panelOpen(title,
    '<div class="step">'
    + '<h3 class="q">'+c.charAt(0).toUpperCase()+c.slice(1)+'</h3>'
    + '<p class="q-hint">'+HINT[c]+'</p>'
    + '<div class="scale" role="radiogroup" aria-label="Score for '+c+'" id="f-scale">'
    + Array.from({length:10}, (_,i) => {
        const v = i+1, on = draft.scores[c] === v;
        return '<button role="radio" data-v="'+v+'" aria-checked="'+on+'"'
          + (on ? ' style="background:'+colour(idx(ME))+'"' : "")+'>'+v+'</button>';
      }).join("")
    + '</div>'
    + '<p class="status" id="f-note" role="status" aria-live="polite"></p></div>',
    '<button class="btn ghost" id="f-skipcat">Skip</button>'
    + '<button class="btn" id="f-next">'+(last ? "Save" : "Next")+'</button>',
    {steps: STEPS, step: 2});

  $("f-scale").querySelectorAll("button").forEach(b => b.onclick = () => {
    const v = Number(b.dataset.v);
    draft.scores[c] = draft.scores[c] === v ? null : v;
    $("f-scale").querySelectorAll("button").forEach(x => {
      const on = Number(x.dataset.v) === draft.scores[c];
      x.setAttribute("aria-checked", String(on));
      x.style.background = on ? colour(idx(ME)) : "";
    });
    if (draft.scores[c] !== null && !last) { draft.cat++; drawStep(); }
  });

  $("f-skipcat").onclick = () => { last ? save() : (draft.cat++, drawStep()); };
  $("f-next").onclick = () => { last ? save() : (draft.cat++, drawStep()); };
}

async function save() {
  const note = $("f-note");
  const btn = $("f-next");
  note.style.color = "var(--muted)";
  note.textContent = "Saving\u2026";
  btn.disabled = true;
  try {
    let id = draft.id;
    const date = draft.visited_on || null;
    if (id) await api("update", {id, name: draft.name, tier: draft.tier, visited_on: date});
    else id = (await api("add", {name: draft.name, tier: draft.tier, visited_on: date})).id;

    if (draft.dataUrl) { note.textContent = "Uploading the photo\u2026"; await api("photo", {id, dataUrl: draft.dataUrl}); }
    if (CATS.some(c => draft.scores[c] !== null)) await api("rate", {id, personId: ME, ...draft.scores});

    DATA = await api("list");
    panelClose();
    render();
  } catch (err) {
    note.style.color = "var(--spark)";
    note.textContent = err.message;
    btn.disabled = false;
  }
}

/* ================= boot ================= */

(async () => {
  if (TG) {
    try {
      const who = await api("whoami");
      if (who.verified) {
        ME = who.me;
        DATA = await api("list");
        start();
        return;
      }
    } catch { /* fall through to the password */ }
  }
  if (!PW) { $("pw").focus(); return; }
  try {
    DATA = await api("list");
    (ME && DATA.people.some(p => p.id === ME)) ? start() : showWho();
  } catch {
    localStorage.removeItem("makan.pw");
    $("pw").focus();
  }
})();
</script>
